<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="format-detection" content="telephone=no">
<title>ICBPI2026 参会信息查询</title>
<style>
  :root{--g:#1f7a4d;--g2:#2e9e63;--bg:#f3f6f4;--card:#fff;--tx:#20302a;--mut:#77877f;--bd:#e2e9e5;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--tx);}
  .wrap{max-width:520px;margin:0 auto;padding:18px 16px 40px;}
  header{text-align:center;padding:10px 0 14px}
  .logo{font-size:13px;color:var(--g);font-weight:700;letter-spacing:.5px}
  h1{font-size:19px;margin:6px 0 2px;font-weight:700}
  .sub{font-size:12px;color:var(--mut)}
  .lang{position:absolute;right:16px;top:16px;font-size:12px;color:var(--g);border:1px solid var(--bd);background:#fff;border-radius:20px;padding:4px 10px;cursor:pointer}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.03)}
  label{display:block;font-size:13px;font-weight:600;margin:12px 0 6px;color:#33443c}
  .hint{font-size:11px;color:var(--mut);font-weight:400;margin-left:6px}
  input{width:100%;height:46px;border:1px solid var(--bd);border-radius:10px;padding:0 12px;font-size:16px;background:#fbfdfc;outline:none}
  input:focus{border-color:var(--g2);background:#fff}
  button{width:100%;height:48px;margin-top:18px;border:0;border-radius:10px;background:linear-gradient(180deg,var(--g2),var(--g));color:#fff;font-size:16px;font-weight:700;letter-spacing:1px}
  button:disabled{opacity:.6}
  .msg{margin-top:14px;font-size:13px;border-radius:10px;padding:10px 12px;display:none}
  .msg.err{display:block;background:#fff2f0;color:#b3261e;border:1px solid #ffdad6}
  .msg.info{display:block;background:#eef6f1;color:#1f5c3e;border:1px solid #d7ebe0}
  .result{display:none;margin-top:16px}
  .rhead{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .rname{font-size:18px;font-weight:700}
  .rzone{font-size:12px;color:#fff;background:var(--g);border-radius:20px;padding:3px 12px;font-weight:600}
  .row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px dashed var(--bd);font-size:14px}
  .row:last-child{border-bottom:0}
  .k{color:var(--mut);flex:0 0 auto}
  .v{text-align:right;font-weight:600;word-break:break-word}
  .multi{font-size:12px;color:#a15c00;background:#fff4e5;border:1px solid #f2dcc0;border-radius:8px;padding:8px 10px;margin-bottom:10px}
  .rsep{height:1px;background:var(--bd);margin:14px -16px}
  .badge{display:inline-block;font-size:12px;border-radius:6px;padding:1px 8px;font-weight:600}
  .ok{background:#e6f4ec;color:#1f7a4d}
  .warn{background:#fff4e5;color:#a15c00}
  .no{background:#eef0f0;color:#6b7772}
  footer{text-align:center;font-size:11px;color:var(--mut);margin-top:22px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <div style="position:relative">
    <div class="lang" id="langBtn" onclick="toggleLang()">EN</div>
    <header>
      <div class="logo">ICBPI 2026</div>
      <h1 id="t-title">参会信息查询</h1>
      <div class="sub" id="t-sub">第八届植物-生物互作国际会议</div>
    </header>
  </div>

  <div class="card">
    <label id="l-name">姓名 / Name</label>
    <input id="in-name" autocomplete="off" placeholder="" onkeydown="if(event.key==='Enter')doQuery()">
    <label id="l-code">手机号后 4 位 <span class="hint" id="l-codehint">（重名时需填；无手机号者可不填）</span></label>
    <input id="in-code" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="____" onkeydown="if(event.key==='Enter')doQuery()">
    <button id="btn" onclick="doQuery()">查询</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="result" id="result">
    <div class="card">
      <div id="r-rows"></div>
    </div>
  </div>

  <footer id="t-foot">请输入与报名时一致的姓名与手机号末四位<br>Please enter the name and last 4 digits used at registration</footer>
</div>

    0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2];

    m[total - 4] = (lo >>> 24) & 255; m[total - 3] = (lo >>> 16) & 255; m[total - 2] = (lo >>> 8) & 255; m[total - 1] = lo & 255;

        w[t] = (w[t - 16] + s0 + w[t - 7] + s1) | 0;
      }

    s+='<div class="row"><div class="k">'+F.fee+'</div><div class="v">'+fee+'</div></div>';
    s=row('report',r.report,s);
    var rf=r.roomFee==null?'':String(r.roomFee).trim();
    s=row('room',(r.room||'')+(rf?(' · '+rf+(CNY(rf)?' 元':'')):''),s);
    s=row('stay',r.stay,s);
    html+=s+'</div>';
  }
  document.getElementById('r-rows').innerHTML=html;
  document.getElementById('result').style.display='block';
}
applyI18N();

// 带参数时自动查询：index.html?name=王燕&code=9394 打开即出结果（可做"一人一码"）
function getParam(k){var m=new RegExp('[?&#]'+k+'=([^&]*)').exec(location.search+location.hash);return m?decodeURIComponent(m[1].replace(/\+/g,' ')):'';}
function autoQuery(){
  var n=getParam('name'); if(!n) return;
  document.getElementById('in-name').value=n;
  document.getElementById('in-code').value=getParam('code');
  doQuery();
}
if(document.readyState==='complete'){autoQuery();}else{window.addEventListener('load',autoQuery);}
</script>
